<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Orion - Space Mission Design & Simulation</title>
<meta name="description" content="An interactive space mission simulation game focusing on orbital mechanics, payload capacities, budget, and power management.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5fa;--card:#fff;--ink:#16203a;--mut:#5d6785;--line:#d5dbea;--acc:#2f5fe0;--ok:#16915a;--bad:#d23a3a;--warn:#c88a0a}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b18;--card:#10172c;--ink:#e6ebfa;--mut:#8e9bc0;--line:#25304f;--acc:#6b93ff;--ok:#3ddc97;--bad:#ff6b6b;--warn:#f5b942}}
:root[data-theme="dark"]{--bg:#070b18;--card:#10172c;--ink:#e6ebfa;--mut:#8e9bc0;--line:#25304f;--acc:#6b93ff;--ok:#3ddc97;--bad:#ff6b6b;--warn:#f5b942}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:18px 16px 6px;max-width:1100px;margin:auto}
h1{margin:0;font-size:clamp(34px,7vw,64px);text-align:center;letter-spacing:.12em;font-weight:800;color:var(--acc)}header .sub{text-align:center}
.sub{color:var(--mut);margin:4px 0 0}
main{max-width:1100px;margin:auto;padding:10px 16px 40px;display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:820px){main{grid-template-columns:1fr}}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc)}
.hint{color:var(--mut);font-size:13px;margin:0 0 10px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.o{border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;background:transparent;color:var(--ink);text-align:left;font:inherit}
.o:hover{border-color:var(--acc)}.o.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.o b{display:block}.o small{color:var(--mut);display:block;font-size:12px}
.panel{position:sticky;top:10px;align-self:start}
.row{display:flex;justify-content:space-between;font-size:13px;margin-top:9px}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.bar.over i{background:var(--bad)}
.warn{font-size:13px;color:var(--warn);margin:6px 0 0}
.bad{color:var(--bad)}.good{color:var(--ok)}
button.go{width:100%;margin-top:12px;padding:12px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
button.go:disabled{opacity:.4;cursor:not-allowed}
#log{font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:300px;overflow:auto}
#log p{margin:3px 0}
.card{text-align:center}.grade{font-size:72px;font-weight:800;line-height:1}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;text-align:left}td{padding:5px 2px;border-top:1px solid var(--line)}td:last-child{text-align:right;font-weight:600}
.o{min-height:48px}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
select{padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.how div{border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px}
details{margin-top:10px;font-size:14px}summary{cursor:pointer;color:var(--acc);font-weight:600}dt{font-weight:700;margin-top:6px}dd{margin:0;color:var(--mut)}
.ck{list-style:none;padding:0;margin:10px 0 0}.ck li{display:flex;gap:8px;margin:8px 0;font-size:13px}.ck small{display:block;color:var(--mut)}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 8px}.steps li{flex:1;text-align:center;font-size:12px;font-weight:700;padding:5px 2px;border-bottom:4px solid var(--line);color:var(--mut)}
.steps .on{border-color:var(--acc);color:var(--ink)}.steps .ok{border-color:var(--ok);color:var(--ok)}.steps .fail{border-color:var(--bad);color:var(--bad)}
#pan.docked{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;margin:0}#pan.docked h2,#pan.docked button.go{grid-column:1/-1}#pan.docked .ck{margin-top:0}#pan.docked button.go{max-width:320px;justify-self:center}
@media(max-width:820px){#pan.docked{grid-template-columns:1fr}}
footer{max-width:1100px;margin:0 auto;padding:8px 16px 36px;text-align:center}footer b{display:block;font-size:18px;letter-spacing:.2em;color:var(--acc)}footer span{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.tips{text-align:left;margin-top:12px;font-size:14px}.tips p{margin:5px 0}
</style></head><body>
<header><h1>SPACE</h1>
<p class="sub">You are the Chief Engineer. Pick a mission, design the spacecraft within budget and physics, then press Launch.</p><p class="sub"><label>Animation speed <select id="spd"><option value="1">Normal</option><option value="2">Fast</option><option value="6">Skip ahead</option></select></label></p></header>
<main><div id="left"></div>
<div class="panel" id="side"><section id="pan"><h2 id="ph">Mission Status</h2><div id="stats"></div><div id="warns"></div>
<button class="go" id="go">🚀 LAUNCH!</button></section></div>
<div id="dock" style="grid-column:1/-1"></div><div id="out" style="grid-column:1/-1"></div><div id="hs" style="grid-column:1/-1"></div></main>
<footer><b>TEAM ORION</b><span>NASA Space Apps Challenge</span></footer>
<script>
const $=id=>document.getElementById(id);
const M={
moon:{n:'Lunar Rover Landing',d:'Land a robotic rover on the Moon. Close and easy on comms and power, but landing is risky.',budget:900,dv:2.6,sun:1,need:1,target:60,req:['cam'],reqT:'Camera',days:5,rad:.1,col:'#b9b9b9'},
mars:{n:'Mars Rock Sampler',d:'Reach Mars and analyse rock. Needs a sampling tool, a decent antenna and a lot of delta-v.',budget:1400,dv:3.0,sun:.43,need:3,target:90,req:['arm','drill'],reqT:'Robotic Arm or Drill',days:210,rad:.25,col:'#c1440e'},
europa:{n:'Europa Ice Probe',d:'Explore Jupiter\u2019s icy moon. Sunlight is 4% of Earth\u2019s, data rates are tough, radiation is brutal.',budget:2600,dv:4.2,sun:.04,need:6,target:110,req:['radar'],reqT:'Radar Sounder',days:2200,rad:.7,col:'#9ec5d6'},
venus:{n:'Venus Cloud Probe',d:'Study the acid clouds of Venus. Sunlight is strong so solar power is great, but the cloud-top entry is demanding.',budget:1200,dv:2.8,sun:1.9,need:2,target:75,req:['spec'],reqT:'Spectrometer',days:150,rad:.15,col:'#e3b45c'},
titan:{n:'Titan Lander',d:'Land on Saturn\u2019s hazy moon. Almost no sunlight, enormous distance and a very expensive delta-v bill.',budget:3000,dv:4.6,sun:.01,need:7,target:120,req:['spec'],reqT:'Spectrometer',days:2600,rad:.2,col:'#d9a441'},
asteroid:{n:'Asteroid Sample Grab',d:'Touch down on a small asteroid and grab a sample. Cheap and low gravity, but faint sunlight and a tight power budget.',budget:800,dv:2.0,sun:.35,need:2,target:55,req:['arm','drill'],reqT:'Robotic Arm or Drill',days:400,rad:.2,col:'#8b7d6b'},
io:{n:'Io Volcano Lander',d:'Land on Jupiter\u2019s volcanic moon. Searing radiation, almost no sunlight and violent terrain. Thermal imaging or spectroscopy is essential.',budget:3400,dv:4.6,sun:.04,need:8,target:140,req:['therm','spec'],reqT:'Thermal Imager or Spectrometer',days:2300,rad:.95,col:'#e0c050'},
enceladus:{n:'Enceladus Plume Sampler',d:'Fly through the geysers of Saturn\u2019s ice moon and taste the ocean below. Very far away, almost no power, delicate science.',budget:3800,dv:5.0,sun:.011,need:9,target:150,req:['plume','gc'],reqT:'Plume Sampler or Gas Chromatograph',days:2700,rad:.15,col:'#e8f2f8'},
triton:{n:'Triton Cryo Lander',d:'The most distant mission yet: Neptune\u2019s frozen moon. Enormous delta-v, no sunlight and a painfully slow data link.',budget:4500,dv:5.6,sun:.001,need:11,target:170,req:['radar','seis'],reqT:'Radar Sounder or Seismometer',days:4000,rad:.2,col:'#c9d6e8'}};
const L=[{n:'Micro Launcher',cap:300,c:25,r:85},{n:'Light Launcher',cap:800,c:60,r:90},{n:'Medium Launcher',cap:2500,c:150,r:94},{n:'Reusable Medium Launcher',cap:2200,c:115,r:92},{n:'Heavy Launcher',cap:6000,c:350,r:96},{n:'Super Heavy Launcher',cap:12000,c:700,r:97},{n:'Mega Launcher',cap:25000,c:1400,r:97}];
const B=[{n:'Micro Bus',m:120,c:30,r:-8,sh:0},{n:'Basic Bus',m:200,c:40,r:-4,sh:0},{n:'Standard Bus',m:300,c:90,r:0,sh:.3},{n:'Hardened Bus',m:400,c:180,r:4,sh:.8},{n:'Radiation-Proof Bus',m:520,c:280,r:6,sh:1},{n:'Armored Deep-Space Bus',m:650,c:380,r:8,sh:1}];
const P=[{n:'Small Solar Array',m:60,c:20,w:300,rtg:0},{n:'Medium Solar Array',m:90,c:30,w:500,rtg:0},{n:'Large Solar Array',m:120,c:40,w:700,rtg:0},{n:'Huge Solar Array',m:200,c:70,w:1200,rtg:0},{n:'RTG (Nuclear Battery)',m:45,c:110,w:250,rtg:1},{n:'Dual RTG',m:85,c:200,w:500,rtg:1},{n:'Advanced RTG',m:70,c:260,w:800,rtg:1},{n:'Fission Reactor',m:300,c:420,w:2000,rtg:1}];
const C=[{n:'Low-Gain Antenna',m:15,c:10,rate:1,d:20},{n:'Medium-Gain Antenna',m:40,c:30,rate:3,d:40},{n:'Small Dish',m:65,c:50,rate:5,d:60},{n:'High-Gain Dish',m:90,c:70,rate:8,d:80},{n:'Deep-Space Array',m:150,c:130,rate:12,d:120},{n:'Laser Comm Terminal',m:120,c:220,rate:18,d:150}];
const I={cam:{n:'Camera',m:25,c:30,s:20,d:40},spec:{n:'Spectrometer',m:40,c:55,s:30,d:60},arm:{n:'Robotic Arm',m:60,c:80,s:25,d:90},drill:{n:'Drill',m:110,c:140,s:45,d:200},radar:{n:'Radar Sounder',m:70,c:100,s:35,d:150},seis:{n:'Seismometer',m:30,c:60,s:20,d:30},mag:{n:'Magnetometer',m:20,c:35,s:15,d:20},dust:{n:'Dust Analyzer',m:35,c:50,s:22,d:35},wx:{n:'Weather Station',m:25,c:40,s:18,d:25},gc:{n:'Gas Chromatograph',m:55,c:90,s:40,d:70},therm:{n:'Thermal Imager',m:35,c:60,s:25,d:45},plume:{n:'Plume Sampler',m:50,c:85,s:35,d:60}};
const G=[{n:'Recycled Parts',c:.5,r:-10,t:'-50% cost, -10 reliability'},{n:'Budget Parts',c:.7,r:-6,t:'-30% cost, -6 reliability'},{n:'Standard Parts',c:1,r:0,t:'Baseline'},{n:'Flight-Proven Parts',c:1.35,r:4,t:'+35% cost, +4 reliability'},{n:'Space-Qualified Parts',c:1.7,r:7,t:'+70% cost, +7 reliability'},{n:'Rad-Hardened Parts',c:2.2,r:10,t:'+120% cost, +10 reliability'}];
const MG=[{n:'No margin',v:0,t:'Lightest, no safety net'},{n:'5% margin',v:.05,t:'Tiny buffer for minor tweaks'},{n:'10% margin',v:.1,t:'Covers small corrections'},{n:'15% margin',v:.15,t:'Covers almost every correction'},{n:'20% margin',v:.2,t:'Heavy, very safe'},{n:'30% margin',v:.3,t:'Very heavy, maximum safety'}];
const WN=[{n:'Express Burn',dv:1.25,c:0,t:.6,d:'Launch immediately: delta-v x1.25, much shorter trip.'},{n:'Fast Track',dv:1.12,c:0,t:.8,d:'Launch now: delta-v x1.12, shorter trip.'},{n:'Optimal Window',dv:1,c:30,t:1,d:'Wait for planetary alignment: baseline delta-v, +$30M operations.'},{n:'Gravity Assist',dv:.85,c:20,t:1.6,d:'Planetary flyby: delta-v x0.85, +60% travel time, more radiation risk, +$20M.'},{n:'Low-Energy Transfer',dv:.75,c:10,t:2.2,d:'Slow spiral path: delta-v x0.75, more than double travel time, +$10M.'},{n:'Multi-Planet Tour',dv:.65,c:45,t:3,d:'Several flybys: delta-v x0.65, three times the travel time, more radiation exposure, +$45M.'}];
const S={w:2,m:'moon',g:2,l:1,b:2,p:0,c:1,mg:2,i:new Set(['cam']),busy:false};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function calc(){const m=M[S.m],g=G[S.g],b=B[S.b],p=P[S.p],c=C[S.c],ins=[...S.i].map(k=>I[k]);
const dry=b.m+p.m+c.m+ins.reduce((a,x)=>a+x.m,0),dv=m.dv*WN[S.w].dv*(1+MG[S.mg].v),fuel=dry*(Math.exp(dv/3.14)-1),wet=dry+fuel,sf=clamp(.75+.45*Math.max(0,(L[S.l].cap-wet)/L[S.l].cap)+.8*MG[S.mg].v-.15*Math.min(1,dry/1500),.6,1.5);
const cost=L[S.l].c+g.c*(b.c+p.c+c.c+ins.reduce((a,x)=>a+x.c,0))+fuel*.04+40+m.days*WN[S.w].t*.012+WN[S.w].c;
const rel=clamp(90+b.r+g.r-.8*ins.length,40,99),avail=p.rtg?p.w:p.w*m.sun,need=80+c.d+ins.reduce((a,x)=>a+x.d,0);
const sci=ins.reduce((a,x)=>a+x.s,0),hasReq=m.req.some(k=>S.i.has(k));
return{sf,days:m.days*WN[S.w].t/sf,m,g,b,p,c,ins,dry,fuel,wet,cost,rel,avail,need,sci,hasReq,cap:L[S.l].cap,okMass:wet<=L[S.l].cap,okBud:cost<=m.budget}}
function grp(title,hint,items,key,fmt){return `<section><h2>${title}</h2><p class="hint">${hint}</p><div class="opts">`+items.map((x,i)=>`<button class="o ${S[key]===i?'sel':''}" data-f="${key}${i}" aria-pressed="${S[key]===i}" onclick="S.${key}=${i};draw()"><b>${x.n}</b><small>${fmt(x)}</small></button>`).join('')+'</div></section>'}
function draw(){const m=M[S.m],fa=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.f:null;
let h=HOW+`<section><h2>1 · Choose Mission</h2><p class="hint">${m.d}</p><div class="opts">`+Object.entries(M).map(([k,x])=>`<button class="o ${S.m===k?'sel':''}" data-f="m${k}" aria-pressed="${S.m===k}" onclick="pick('${k}')"><b>${x.n}</b><small>Budget $${x.budget}M · Δv ${x.dv} km/s</small><small>Science target: ${x.target} pts · ${DIF[k]}</small></button>`).join('')+'</div></section>';
h+=grp('2 · Launch Vehicle','Bigger rockets lift more mass but eat the budget.',L,'l',x=>`Lifts ${x.cap} kg · $${x.c}M · ${x.r}% reliable`);
h+=grp('3 · Spacecraft Bus','Cheap buses fail more often and offer little radiation shielding.',B,'b',x=>`${x.m} kg · $${x.c}M · reliability ${x.r>=0?'+':''}${x.r}`);
h+=`<section><h2>4 · Science Payload</h2><p class="hint">Required for this mission: <b>${m.reqT}</b>. Each instrument adds mass, power draw and failure risk.</p><div class="opts">`+Object.entries(I).map(([k,x])=>`<button class="o ${S.i.has(k)?'sel':''}" data-f="i${k}" aria-pressed="${S.i.has(k)}" onclick="tog('${k}')"><b>${x.n}</b><small>${x.m} kg · $${x.c}M · ${x.d} W</small><small>Science +${x.s}</small></button>`).join('')+'</div></section>';
h+=grp('5 · Power System','Solar output drops with distance from the Sun. RTGs work anywhere but are expensive.',P,'p',x=>`${x.m} kg · $${x.c}M · ${x.w} W${x.rtg?'':' at Earth'}`);
h+=grp('6 · Communications','Deep space needs a higher data rate to send your results home.',C,'c',x=>`${x.m} kg · $${x.c}M · rate ${x.rate} · ${x.d} W`);
h+=grp('7 · Part Quality','Trade cost against reliability.',G,'g',x=>x.t);
h+=grp('8 · Delta-v Margin','Extra fuel for surprise trajectory corrections.',MG,'mg',x=>x.t);
h+=grp('9 · Orbital Window','Pick when and how to depart. Alignment saves fuel but costs time or money.',WN,'w',x=>x.d);
h+=AUTO();
$('left').innerHTML=h;
const k=calc(),bar=(v,mx,bad)=>`<div class="bar ${bad?'over':''}"><i style="width:${clamp(v/mx*100,0,100)}%"></i></div>`;
$('stats').innerHTML=`<div class="row"><span>Cost</span><b class="${k.okBud?'':'bad'}">$${k.cost.toFixed(0)}M / $${k.m.budget}M</b></div>${bar(k.cost,k.m.budget,!k.okBud)}
<div class="row"><span>Launch mass</span><b class="${k.okMass?'':'bad'}">${k.wet.toFixed(0)} / ${k.cap} kg</b></div>${bar(k.wet,k.cap,!k.okMass)}
<div class="row"><span>Dry mass</span><b>${k.dry.toFixed(0)} kg</b></div><div class="row"><span>Fuel needed</span><b>${k.fuel.toFixed(0)} kg</b></div><div class="row"><span>Transit time</span><b>${k.days>=365?(k.days/365).toFixed(1)+' yr':Math.round(k.days)+' days'}</b></div>
<div class="row"><span>Cruise speed</span><b>${(9*k.sf/WN[S.w].t).toFixed(1)} km/s</b></div>
<div class="row"><span>Power</span><b class="${k.avail>=k.need?'good':'bad'}">${k.avail.toFixed(0)} / ${k.need} W</b></div>${bar(k.avail,k.need,k.avail<k.need)}
<div class="row"><span>Comms rate</span><b class="${k.c.rate>=k.m.need?'good':'bad'}">${k.c.rate} / ${k.m.need}</b></div>
<div class="row"><span>Science</span><b>${k.sci} / ${k.m.target} pts</b></div>
<div class="row"><span>Spacecraft reliability</span><b>${k.rel.toFixed(0)}%</b></div>`;
const ck=[[k.okMass,'Fits on the rocket','Too heavy: pick a bigger launcher or remove equipment.'],[k.okBud,'Within budget','Over budget: choose cheaper parts or a smaller launcher.'],[k.hasReq,'Has the key instrument ('+k.m.reqT+')','Add: '+k.m.reqT+'.'],[k.avail>=k.need,'Enough electrical power','Add a bigger solar array or an RTG.'],[k.c.rate>=k.m.need,'Antenna strong enough','Weak antenna: some data will be lost.'],[k.sci>=k.m.target,'Science target reachable','Add more instruments.']];
$('warns').innerHTML='<ul class="ck">'+ck.map(c=>`<li><span aria-hidden="true">${c[0]?'✅':'❌'}</span><span><b>${c[1]}</b>${c[0]?'':'<small>'+c[2]+'</small>'}</span></li>`).join('')+'</ul>';
$('go').disabled=S.busy||!k.okMass||!k.okBud;$('go').textContent=!k.okMass?'Too heavy to launch':!k.okBud?'Over budget':'🚀 LAUNCH!';
if(fa){const e=document.querySelector('[data-f="'+fa+'"]');if(e)e.focus({preventScroll:true})}}
function pick(k){AM='';S.m=k;S.i=new Set(M[k].req.slice(0,1));$('out').innerHTML='';draw()}
function tog(k){S.i.has(k)?S.i.delete(k):S.i.add(k);draw()}
const spd=()=>+$('spd').value||1;const sl=ms=>new Promise(r=>setTimeout(r,ms/spd()));
$('go').onclick=async()=>{const k=calc(),m=k.m;S.busy=true;draw();
$('out').innerHTML='<section><h2>Mission Control</h2><ol id="steps" class="steps" aria-label="Mission phases"><li>1 Launch</li><li>2 Cruise</li><li>3 Arrival</li><li>4 Science</li></ol><canvas id="cv" width="800" height="320" role="img" aria-label="Animation of your spacecraft flight" style="width:100%;height:auto;border-radius:10px;background:#04060f"></canvas><p id="cap" aria-live="polite" style="margin:8px 0 0"></p></section><section><h2>Mission Log</h2><div id="log" aria-live="polite" role="log"></div></section>';$('out').scrollIntoView({behavior:RM?'auto':'smooth',block:'start'});A.col=m.col;A.tn=S.m[0].toUpperCase()+S.m.slice(1);A.tr=S.m==='asteroid'?13:S.m==='moon'?20:26;A.days=k.days;A.parts=[];A.cause='';A.cs=clamp(k.sf/WN[S.w].t,.5,2.2);A.as=1+.5*Math.max(0,(k.cap-k.wet)/k.cap);A.ls=1+MG[S.mg].v;
const log=(t,c)=>{const p=document.createElement('p');p.innerHTML=t;if(c)p.className=c;$('log').appendChild(p);$('log').scrollTop=1e9};
const end=async(why,sci)=>{await sl(why==='Mission complete'?2200:4000);S.busy=false;draw();report(k,why,sci)};
setPh('ascent');log('T-10 … ignition sequence start.');await sl(2700);
if(Math.random()*100>L[S.l].r){A.cause=rnd(WHY.launch)+' (This launcher is '+L[S.l].r+'% reliable.)';setPh('boom');log('💥 The rocket failed during ascent. Payload lost.','bad');log('Cause: '+A.cause,'bad');return end('Launch failure',0)}
log('✅ Liftoff! Atmosphere cleared, spacecraft in orbit.','good');await sl(1500);
setPh('cruise');log(`Trans-planetary injection burn complete (${WN[S.w].n}). Cruise: ~${Math.round(k.days)} days at ${(9*k.sf/WN[S.w].t).toFixed(1)} km/s.`);await sl(1100);
let ins=[...S.i],pl=1,cl=1,lk=0,cd=1;
if(Math.random()<m.rad*Math.sqrt(k.days/m.days)){A.stormT=420;log('☢ Radiation storm hits the spacecraft!','warn');await sl(1600);
if(Math.random()>k.b.sh&&ins.length){const lost=ins.splice(Math.floor(Math.random()*ins.length),1)[0];log(`Shielding insufficient: the ${I[lost].n} was damaged.`,'bad')}else log('Shielding held. No damage.','good');await sl(1600)}
